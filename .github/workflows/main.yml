name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Build Docker Image
      run: docker build -t gideon9900/healthcare-app:latest .

    - name: Login to DockerHub
      run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u "gideon9900" --password-stdin

    - name: Push Docker Image
      run: docker push gideon9900/healthcare-app:latest